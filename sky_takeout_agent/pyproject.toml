requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.16",
    "dotenv-linter>=0.9.0",
    "fastapi[standard]>=0.143.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
