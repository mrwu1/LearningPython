[project]
name = "sky-takeout-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.25.0",
    "asyncmy>=0.2.16",
    "bcrypt>=5.0.0",
    "display>=1.0.0",
    "dotenv-linter>=0.9.0",
    "fastapi[standard]>=0.143.1",
    "langchain-core>=1.6.11",
    "langgraph>=1.2.15",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
