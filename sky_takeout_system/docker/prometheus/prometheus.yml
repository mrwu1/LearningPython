global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'sky_takeout_agent'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 3s
    static_configs:
      - targets: ['sky-takeout-app:8000']
        labels:
          app: 'sky-takeout-agent-gateway'
          env: 'production'
